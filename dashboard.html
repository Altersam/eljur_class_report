.tab:hover{background:#e3f2fd}.tab.on{background:#1a237e;color:#fff;border-color:#1a237e}
.page{display:none}.page.on{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1a237e;color:#fff;padding:7px 5px;text-align:left;font-weight:600;position:sticky;top:0}

.ok{color:#2e7d32}.bad{color:#c62828}.warn{color:#e65100}
.chart2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-box{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.chart-box h3{font-size:14px;color:#333;margin-bottom:10px}.chart-box.wide{grid-column:1/-1}
select{padding:8px 12px;font-size:14px;border:2px solid #1a237e;border-radius:6px;width:320px;max-width:100%;margin-bottom:12px}
.pbox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.phead{background:linear-gradient(135deg,#283593,#5c6bc0);color:#fff;padding:16px;border-radius:10px;margin-bottom:12px}
.phead h3{font-size:18px}.phead .sub{font-size:13px;opacity:.9;margin-top:4px}

const dist=[0,0,0,0,0,0];const dl=['<3.0','3.0-3.5','3.5-4.0','4.0-4.6','4.6-4.8','4.8-5.0'];S.forEach(st=>{const v=avg(Object.values(D.averages[st]||{}));if(v<3.0)dist[0]++;else if(v<3.5)dist[1]++;else if(v<4.0)dist[2]++;else if(v<4.6)dist[3]++;else if(v<4.8)dist[4]++;else dist[5]++})
charts.push(new Chart(document.getElementById('dp'),{type:'doughnut',data:{labels:dl,datasets:[{data:dist,backgroundColor:['#ef5350','#ff7043','#ffa726','#ffd54f','#aed581','#66bb6a']}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}}))
const pcn=[0,0,0,0];S.forEach(st=>{const v=avg(Object.values(D.averages[st]||{}));pcn[5-pred(v)]++})
charts.push(new Chart(document.getElementById('pp'),{type:'doughnut',data:{labels:['5','4','3','2'],datasets:[{data:pcn,backgroundColor:['#66bb6a','#42a5f5','#ffa726','#ef5350']}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}}))}

function showProfile(name){dc()
const dt=D.details[name]||{};const avgs=D.averages[name]||{};const vs=Object.values(avgs);const ov=vs.length?avg(vs):0
let h='<p style="margin-bottom:8px"><select id="psel" onchange="showProfile(this.value)">';S.forEach(s=>{h+='<option value="'+s+'"'+(s===name?' selected':'')+'>'+s+'</option>'});h+='</select></p>'
const totGr=Object.values(dt).reduce((a,b)=>a+b.count,0);const totAbs=Object.values(dt).reduce((a,b)=>a+(b.absences||0),0)
h+='<div class="phead"><h3>'+name+'</h3><div class="sub">Средний: '+ov.toFixed(2)+' -> итог: <strong class="'+pc(ov)+'">'+pred(ov)+'</strong> | Оценок: '+totGr+' | НКИ: '+totAbs+' | Предметов: '+Object.keys(dt).length+'</div></div>'
h+='<div class="pbox"><div class="pcard"><h3>Лепестковая (средние баллы)</h3><canvas id="pr"></canvas></div><div class="pcard"><h3>Средние баллы по предметам</h3><canvas id="pb"></canvas></div></div>'
function sortDate(a,b){const ka=a.split('.').reverse().join('.');const kb=b.split('.').reverse().join('.');if(ka<kb)return -1;if(ka>kb)return 1;return 0}
const subjs=(D.student_subjects&&D.student_subjects[name])?D.student_subjects[name]:SUB.filter(s=>dt[s]!==undefined);const miniColors=['#43a047','#1e88e5','#e53935','#fb8c00','#8e24aa','#00897b','#fdd835','#5c6bc0','#f06292','#26a69a','#ec407a','#8d6e63','#78909c','#a1887f','#4db6ac','#d81b60','#00acc1','#ffb300','#7cb342','#6d4c41','#37474f','#9575cd','#2e7d32','#c62828']
h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:16px">'
subjs.forEach((s,idx)=>{const d=dt[s];const entries=d.entries;const color=miniColors[idx%miniColors.length];const chartId='mc'+idx;const sorted=entries.length>1?[...entries].sort((a,b)=>sortDate(a.date,b.date)):entries;const labels=sorted.map(e=>e.date).filter(e=>e.includes('.'));const data=sorted.map(e=>e.grade)
h+='<div style="background:#fafafa;border-radius:8px;padding:10px;border:1px solid #e0e0e0"><div style="font-size:12px;font-weight:600;color:'+color+';margin-bottom:4px">'+s+'</div><div style="font-size:11px;color:#888;margin-bottom:6px">'+(d.teacher||'')+'</div>'
if(labels.length>=2){h+='<div style="height:120px"><canvas id="'+chartId+'"></canvas></div>'}else if(labels.length===1){h+='<div style="text-align:center;padding:16px;color:#888;font-size:12px">Одна оценка: <strong>'+data[0]+'</strong> ('+labels[0]+')</div>'}else{h+='<div style="text-align:center;padding:16px;color:#aaa;font-size:12px">Нет данных</div>'}
h+='</div>'
if(labels.length>=2){setTimeout(()=>{const ctx=document.getElementById(chartId);if(!ctx)return;charts.push(new Chart(ctx,{type:'line',data:{labels:labels,datasets:[{data:data,backgroundColor:color,borderColor:color,borderWidth:2,pointRadius:3,pointHoverRadius:6,fill:false,tension:0.3}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{display:true,ticks:{font:{size:8},maxTicksLimit:3}},y:{min:0,max:6,ticks:{stepSize:1,font:{size:8},callback:v=>v>=0&&v<=5?v:''}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:t=>t.raw+' ('+t.label+')'}}}}}))},10)}
})
h+='</div>'
h+='<div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>Предмет</th><th>Учитель</th><th>Оценки</th><th>НКИ</th><th>Среднее</th><th>Итог</th></tr></thead><tbody>'
subjs.forEach(s=>{const d=dt[s];h+='<tr><td>'+s+'</td><td>'+(d.teacher||'')+'</td><td>'+d.grades.join(', ')+'</td><td class="bad">'+(d.absences||0)+'</td><td class="'+tag(d.avg)+'">'+d.avg+'</td><td class="'+pc(d.avg)+'">'+d.predicted+'</td></tr>'})
h+='</tbody></table></div>';const el=document.getElementById('page-profile');el.innerHTML=h
const radarSubjs=subjs.filter(s=>dt[s]&&dt[s].avg>0);const rLabs=radarSubjs.map(s=>s.length>16?s.substr(0,14)+'..':s);const rVals=radarSubjs.map(s=>dt[s].avg)
charts.push(new Chart(document.getElementById('pr'),{type:'radar',data:{labels:rLabs,datasets:[{label:'Средний балл',data:rVals,borderColor:'#5c6bc0',backgroundColor:'rgba(92,107,192,0.1)',pointBackgroundColor:rVals.map(v=>v>=4.6?'#2e7d32':'#c62828'),borderWidth:2}]},options:{responsive:true,scales:{r:{min:1,max:5,ticks:{stepSize:1}}},plugins:{legend:{display:false}}}}))
const bLabs=subjs.map(s=>s.length>16?s.substr(0,14)+'..':s);const bVals=subjs.map(s=>dt[s]&&dt[s].avg>0?dt[s].avg:0)
charts.push(new Chart(document.getElementById('pb'),{type:'bar',data:{labels:bLabs,datasets:[{label:'Средний балл',data:bVals,backgroundColor:bVals.map(v=>v>=4.6?'#43a047':v>0?'#ffa726':'#e0e0e0'),borderRadius:4}]},options:{responsive:true,indexAxis:'y',scales:{x:{min:0,max:5,ticks:{callback:v=>v>=0&&v<=5?v:''}}},plugins:{legend:{display:false}}}}))
}
buildOverview()
</script>
